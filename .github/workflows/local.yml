name: Iktara local app
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: iktara-local-${{ github.ref }}
  cancel-in-progress: true
jobs:
  local:
    name: Test, build, and boot
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.0
          cache: npm
          cache-dependency-path: apps/local/package-lock.json
      - uses: astral-sh/setup-uv@v6
        with:
          version: 0.11.7
      - run: uv sync --frozen --python 3.12
        working-directory: shastra-compute
      - run: npm ci
        working-directory: apps/local
      - name: Verify pinned original engines and evidence adapter
        run: |
          .venv/bin/python -m unittest discover -s tests -p 'parity*.py' -v
          .venv/bin/python -m unittest discover -s tests -p 'test*.py' -v
        working-directory: shastra-compute
      - run: npm test
        working-directory: apps/local
      - run: npm run project:check
      - name: Validate release contract
        run: |
          node scripts/release-record.mjs check
          node --test scripts/release-record.test.mjs
      - run: npm run build
        working-directory: apps/local
      # apps/web builds with pnpm (version pinned in apps/web packageManager).
      - uses: pnpm/action-setup@v4
        with:
          version: 10.31.0
      - run: pnpm install --frozen-lockfile
        working-directory: apps/web
      - run: pnpm build
        working-directory: apps/web
      - name: Boot services and verify real chart calculation
        run: node scripts/deploy-smoke.mjs .
      - name: Check host entry point
        run: node --test scripts/deploy-host.test.mjs

# PRs execute only on GitHub-hosted runners. The Mac polls successful push-to-main
# runs for the exact immutable revision; it is never a self-hosted CI runner.
